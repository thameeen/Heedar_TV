name: Android CI

on:
  push:
    branches:
      - appjet
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle-wrapper.jar is committed, so the Gradle distribution is
      # provisioned by the action instead of ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-output
          path: |
            app/build/reports/tests/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
